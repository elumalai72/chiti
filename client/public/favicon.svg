<svg width="64" height="64" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="navyBg" x1="0" y1="0" x2="100" y2="100" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#0D1322" />
      <stop offset="100%" stopColor="#070B14" />
    </linearGradient>
    <linearGradient id="calcGrad" x1="33" y1="20" x2="67" y2="80" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stopColor="#8B5CF6" />
      <stop offset="50%" stopColor="#7C3AED" />
      <stop offset="100%" stopColor="#6D28D9" />
    </linearGradient>
    <filter id="cShadow" x="20%" y="10%" width="60%" height="80%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" floodColor="#7C3AED" floodOpacity="0.4" />
    </filter>
  </defs>

  {/* Clean Rounded-Square Navy App Icon */}
  <rect width="100" height="100" rx="26" fill="url(#navyBg)" />
  <rect x="0.75" y="0.75" width="98.5" height="98.5" rx="25.25" stroke="rgba(255, 255, 255, 0.1)" strokeWidth="1.5" />

  {/* Small Minimal Centered Calculator */}
  <g filter="url(#cShadow)">
    <rect x="33" y="22" width="34" height="56" rx="8" fill="url(#calcGrad)" />
    <path d="M 37 22 L 63 22" stroke="rgba(255, 255, 255, 0.45)" strokeWidth="1.5" strokeLinecap="round" />

    {/* Display Screen */}
    <rect x="38" y="28" width="24" height="12" rx="3.5" fill="#0B0F19" />
    <rect x="42" y="32" width="6" height="3.5" rx="1.5" fill="#C084FC" />
    <rect x="51" y="32" width="7" height="3.5" rx="1.5" fill="#A855F7" />

    {/* Keypad Buttons */}
    <circle cx="43.5" cy="48.5" r="3" fill="#FFFFFF" fillOpacity="0.95" />
    <circle cx="56.5" cy="48.5" r="3" fill="#FFFFFF" fillOpacity="0.95" />

    <circle cx="43.5" cy="58.5" r="3" fill="#FFFFFF" fillOpacity="0.95" />
    <circle cx="56.5" cy="58.5" r="3" fill="#FFFFFF" fillOpacity="0.95" />

    <circle cx="43.5" cy="68.5" r="3" fill="#DDD6FE" />
    <rect x="52.5" y="66" width="8" height="5" rx="2" fill="#F43F5E" />
  </g>
</svg>